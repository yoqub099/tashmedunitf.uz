name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PHP_VERSION: "8.3"
  NODE_VERSION: "20"
  PNPM_VERSION: "10.28.2"
  POSTGRES_DB: tmtu_termiz_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

# Cancel in-progress runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # API (Laravel) — tests + lint
  # ============================================================
  api:
    name: API (Laravel)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, gd, zip, intl, bcmath, redis, exif, pcntl, imagick
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer deps
        working-directory: apps/api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Configure env
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate
        working-directory: apps/api
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: ${{ env.POSTGRES_DB }}
          DB_USERNAME: ${{ env.POSTGRES_USER }}
          DB_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          REDIS_HOST: 127.0.0.1
        run: php artisan migrate --force

      - name: Pint (lint)
        working-directory: apps/api
        run: vendor/bin/pint --test

      - name: PHPStan (typecheck)
        working-directory: apps/api
        run: vendor/bin/phpstan analyse app --level=5 --memory-limit=1G

      - name: PHPUnit (tests)
        working-directory: apps/api
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: ${{ env.POSTGRES_DB }}
          DB_USERNAME: ${{ env.POSTGRES_USER }}
          DB_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          REDIS_HOST: 127.0.0.1
          CACHE_STORE: redis
        run: php artisan test --parallel --coverage-text

  # ============================================================
  # Frontend / Admin (Next.js) — lint + typecheck + build via Turborepo
  # ============================================================
  frontend:
    name: Frontend & Admin (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint --filter='./apps/*' --filter='./packages/*'

      - name: Typecheck
        run: pnpm turbo typecheck --filter='./apps/*' --filter='./packages/*'

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          REVALIDATION_SECRET: ci-test-secret
        run: pnpm turbo build --filter=@tmtu/web --filter=@tmtu/admin

  # ============================================================
  # E2E (Playwright) — only on main branch
  # ============================================================
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    needs: [api, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: ${{ env.POSTGRES_DB }}
      DB_USERNAME: ${{ env.POSTGRES_USER }}
      DB_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
      REDIS_HOST: 127.0.0.1
      CACHE_STORE: redis
      ADMIN_PASSWORD: Admin123456
      REVALIDATION_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, gd, zip, intl, bcmath, redis, exif, pcntl, imagick
          tools: composer:v2

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @tmtu/e2e install:browsers

      - name: Install API deps
        working-directory: apps/api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare API (env + migrate + seed)
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force --seed

      - name: Build Next.js apps
        run: |
          NEXT_PUBLIC_API_URL=http://127.0.0.1:8000/api pnpm --filter @tmtu/web build
          NEXT_PUBLIC_API_URL=http://127.0.0.1:8000/api/v1 pnpm --filter @tmtu/admin build

      - name: Run E2E (boot API + web + admin, then test)
        run: |
          (cd apps/api && php artisan serve --host=127.0.0.1 --port=8000 > /tmp/api.log 2>&1 &)
          (pnpm --filter @tmtu/web start > /tmp/web.log 2>&1 &)
          (pnpm --filter @tmtu/admin start > /tmp/admin.log 2>&1 &)
          npx --yes wait-on -t 120000 \
            http://127.0.0.1:8000/api/health \
            http://127.0.0.1:3000/api/health \
            http://127.0.0.1:3001
          pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/report/
            e2e/test-results/
          retention-days: 7

  # ============================================================
  # Docker build (verification only on PR; push on main)
  # ============================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [api, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/images/Dockerfile.api
          push: false
          tags: tmtu/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/images/Dockerfile.web
          push: false
          tags: tmtu/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build admin image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/images/Dockerfile.admin
          push: false
          tags: tmtu/admin:latest
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  # ============================================================
  # Deploy to production (manual approval gate via environment)
  # ============================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://tashmedunitf.uz

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/tmtu-termiz
            ./scripts/deploy.sh docker
