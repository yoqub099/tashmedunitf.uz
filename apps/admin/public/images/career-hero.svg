<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1A3F"/>
      <stop offset="40%" stop-color="#6B1535"/>
      <stop offset="100%" stop-color="#4A0E25"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base gradient -->
  <rect width="1440" height="800" fill="url(#bg)"/>
  <rect width="1440" height="800" fill="url(#glow1)"/>
  <rect width="1440" height="800" fill="url(#glow2)"/>

  <!-- Briefcase (bottom-left) -->
  <g transform="translate(100, 480) scale(2)" opacity="0.10">
    <rect x="5" y="20" width="50" height="35" rx="4" stroke="#ffffff" stroke-width="2" fill="none"/>
    <path d="M18 20 V14 Q18 8 24 8 H36 Q42 8 42 14 V20" stroke="#ffffff" stroke-width="2" fill="none"/>
    <line x1="5" y1="32" x2="55" y2="32" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="25" y="28" width="10" height="8" rx="2" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Growth chart (right side) -->
  <g transform="translate(1020, 120) scale(1.6)" opacity="0.08">
    <line x1="10" y1="150" x2="10" y2="10" stroke="#ffffff" stroke-width="2"/>
    <line x1="10" y1="150" x2="200" y2="150" stroke="#ffffff" stroke-width="2"/>
    <polyline points="30,130 60,110 90,120 120,80 150,60 180,30" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="130" r="3" fill="#ffffff"/>
    <circle cx="60" cy="110" r="3" fill="#ffffff"/>
    <circle cx="90" cy="120" r="3" fill="#ffffff"/>
    <circle cx="120" cy="80" r="3" fill="#ffffff"/>
    <circle cx="150" cy="60" r="3" fill="#ffffff"/>
    <circle cx="180" cy="30" r="3" fill="#ffffff"/>
  </g>

  <!-- Building (top-left area) -->
  <g transform="translate(50, 60) scale(1.3)" opacity="0.07">
    <rect x="10" y="30" width="60" height="80" rx="2" stroke="#ffffff" stroke-width="2" fill="none"/>
    <rect x="20" y="40" width="10" height="10" rx="1" fill="#ffffff" opacity="0.4"/>
    <rect x="35" y="40" width="10" height="10" rx="1" fill="#ffffff" opacity="0.4"/>
    <rect x="50" y="40" width="10" height="10" rx="1" fill="#ffffff" opacity="0.4"/>
    <rect x="20" y="55" width="10" height="10" rx="1" fill="#ffffff" opacity="0.4"/>
    <rect x="35" y="55" width="10" height="10" rx="1" fill="#ffffff" opacity="0.4"/>
    <rect x="50" y="55" width="10" height="10" rx="1" fill="#ffffff" opacity="0.4"/>
    <rect x="20" y="70" width="10" height="10" rx="1" fill="#ffffff" opacity="0.4"/>
    <rect x="35" y="70" width="10" height="10" rx="1" fill="#ffffff" opacity="0.4"/>
    <rect x="50" y="70" width="10" height="10" rx="1" fill="#ffffff" opacity="0.4"/>
    <rect x="30" y="90" width="20" height="20" rx="1" fill="#ffffff" opacity="0.3"/>
    <line x1="40" y1="10" x2="40" y2="30" stroke="#ffffff" stroke-width="2"/>
    <polygon points="20,30 40,10 60,30" stroke="#ffffff" stroke-width="2" fill="none"/>
  </g>

  <!-- Handshake (center) -->
  <g transform="translate(600, 350) scale(1.8)" opacity="0.06">
    <path d="M10 30 Q15 20 25 25 L40 35 Q50 40 55 30" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M55 30 L65 25 Q70 22 75 28 L60 45 Q55 50 48 48 L30 38" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <line x1="0" y1="35" x2="15" y2="25" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="80" y1="32" x2="65" y2="22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Graduation cap (top-right) -->
  <g transform="translate(1150, 60) scale(1.5)" opacity="0.09">
    <polygon points="40,10 80,25 40,40 0,25" stroke="#ffffff" stroke-width="2" fill="none"/>
    <line x1="40" y1="40" x2="40" y2="60" stroke="#ffffff" stroke-width="2"/>
    <path d="M15 28 L15 45 Q15 55 40 58 Q65 55 65 45 L65 28" stroke="#ffffff" stroke-width="2" fill="none"/>
    <circle cx="40" cy="62" r="3" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Target/Goal (bottom-right) -->
  <g transform="translate(1200, 550) scale(1.4)" opacity="0.08">
    <circle cx="40" cy="40" r="35" stroke="#ffffff" stroke-width="2" fill="none"/>
    <circle cx="40" cy="40" r="24" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <circle cx="40" cy="40" r="13" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <circle cx="40" cy="40" r="4" fill="#ffffff"/>
    <line x1="60" y1="20" x2="44" y2="36" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <polyline points="52,18 62,18 62,28" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- People network (center-left) -->
  <g transform="translate(280, 200) scale(1.2)" opacity="0.07">
    <circle cx="50" cy="30" r="8" stroke="#ffffff" stroke-width="2" fill="none"/>
    <circle cx="20" cy="70" r="8" stroke="#ffffff" stroke-width="2" fill="none"/>
    <circle cx="80" cy="70" r="8" stroke="#ffffff" stroke-width="2" fill="none"/>
    <line x1="45" y1="37" x2="25" y2="63" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="55" y1="37" x2="75" y2="63" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="28" y1="70" x2="72" y2="70" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Decorative dots pattern (scattered) -->
  <g opacity="0.05">
    <circle cx="400" cy="100" r="2" fill="#ffffff"/>
    <circle cx="420" cy="100" r="2" fill="#ffffff"/>
    <circle cx="440" cy="100" r="2" fill="#ffffff"/>
    <circle cx="400" cy="120" r="2" fill="#ffffff"/>
    <circle cx="420" cy="120" r="2" fill="#ffffff"/>
    <circle cx="440" cy="120" r="2" fill="#ffffff"/>
    <circle cx="400" cy="140" r="2" fill="#ffffff"/>
    <circle cx="420" cy="140" r="2" fill="#ffffff"/>
    <circle cx="440" cy="140" r="2" fill="#ffffff"/>
  </g>

  <g opacity="0.04">
    <circle cx="800" cy="600" r="2" fill="#ffffff"/>
    <circle cx="820" cy="600" r="2" fill="#ffffff"/>
    <circle cx="840" cy="600" r="2" fill="#ffffff"/>
    <circle cx="800" cy="620" r="2" fill="#ffffff"/>
    <circle cx="820" cy="620" r="2" fill="#ffffff"/>
    <circle cx="840" cy="620" r="2" fill="#ffffff"/>
  </g>
</svg>
