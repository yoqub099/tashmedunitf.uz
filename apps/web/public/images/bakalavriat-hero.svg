<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00575B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003d40;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.03" />
    </linearGradient>
  </defs>
  <rect width="960" height="460" fill="url(#bg)" rx="24"/>
  <!-- Decorative circles -->
  <circle cx="780" cy="80" r="120" fill="url(#accent)"/>
  <circle cx="850" cy="200" r="80" fill="url(#accent)"/>
  <circle cx="160" cy="380" r="100" fill="url(#accent)"/>
  <!-- Medical cross icon -->
  <g transform="translate(480,200)" opacity="0.15">
    <rect x="-15" y="-50" width="30" height="100" rx="8" fill="white"/>
    <rect x="-50" y="-15" width="100" height="30" rx="8" fill="white"/>
  </g>
  <!-- Stethoscope hint -->
  <g transform="translate(480,280)" opacity="0.12">
    <circle cx="0" cy="0" r="25" stroke="white" stroke-width="3" fill="none"/>
    <path d="M-18,-20 C-18,-50 18,-50 18,-20" stroke="white" stroke-width="3" fill="none"/>
  </g>
  <!-- Text -->
  <text x="480" y="170" text-anchor="middle" font-family="Georgia,serif" font-size="48" fill="white" font-weight="bold" opacity="0.9">Bakalavriat</text>
  <text x="480" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white" opacity="0.5">TOSHKENT TIBBIYOT AKADEMIYASI TERMIZ FILIALI</text>
</svg>