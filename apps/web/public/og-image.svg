<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="300" fill="url(#accentGrad)" />
  <circle cx="1100" cy="530" r="250" fill="url(#accentGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="630" />
    <line x1="400" y1="0" x2="1200" y2="420" />
    <line x1="800" y1="0" x2="1200" y2="210" />
    <line x1="0" y1="210" x2="800" y2="630" />
    <line x1="0" y1="420" x2="400" y2="630" />
  </g>

  <!-- Top border accent -->
  <rect x="0" y="0" width="1200" height="5" fill="#fbbf24" />

  <!-- Bottom border accent -->
  <rect x="0" y="625" width="1200" height="5" fill="#fbbf24" />

  <!-- Medical Caduceus Symbol -->
  <g transform="translate(600, 260) scale(1.1)" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Central staff -->
    <line x1="0" y1="-95" x2="0" y2="60" stroke-width="4" />

    <!-- Wings (left) -->
    <path d="M -5,-85 C -15,-100 -45,-110 -65,-95 C -80,-84 -75,-70 -60,-72 C -45,-74 -30,-85 -20,-80" />
    <path d="M -5,-80 C -12,-90 -35,-98 -50,-88 C -60,-80 -58,-72 -48,-73 C -38,-74 -25,-80 -18,-76" />

    <!-- Wings (right) -->
    <path d="M 5,-85 C 15,-100 45,-110 65,-95 C 80,-84 75,-70 60,-72 C 45,-74 30,-85 20,-80" />
    <path d="M 5,-80 C 12,-90 35,-98 50,-88 C 60,-80 58,-72 48,-73 C 38,-74 25,-80 18,-76" />

    <!-- Left serpent -->
    <path d="M 0,55 C -20,45 -30,30 -25,15 C -18,0 0,5 5,-5 C 10,-15 -15,-20 -20,-35 C -25,-50 -5,-55 0,-50 C 5,-45 -10,-40 -8,-30 C -5,-18 15,-10 0,5 C -10,15 -18,25 -10,40 C -5,48 0,50 0,55" stroke-width="3" />

    <!-- Right serpent -->
    <path d="M 0,55 C 20,45 30,30 25,15 C 18,0 0,5 -5,-5 C -10,-15 15,-20 20,-35 C 25,-50 5,-55 0,-50 C -5,-45 10,-40 8,-30 C 5,-18 -15,-10 0,5 C 10,15 18,25 10,40 C 5,48 0,50 0,55" stroke-width="3" />

    <!-- Top circle/orb -->
    <circle cx="0" cy="-100" r="8" fill="#fbbf24" stroke="none" />
  </g>

  <!-- University name (top) -->
  <text x="600" y="130" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" letter-spacing="6" opacity="0.9">
    TOSHKENT DAVLAT TIBBIYOT UNIVERSITETI
  </text>

  <!-- Decorative line under top text -->
  <line x1="300" y1="148" x2="900" y2="148" stroke="#fbbf24" stroke-width="1.5" opacity="0.6" />

  <!-- Main title -->
  <text x="600" y="450" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" letter-spacing="12">
    TERMIZ FILIALI
  </text>

  <!-- Decorative line under main title -->
  <line x1="350" y1="475" x2="850" y2="475" stroke="#fbbf24" stroke-width="2" opacity="0.7" />

  <!-- Subtitle -->
  <text x="600" y="510" text-anchor="middle" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" letter-spacing="8" opacity="0.85">
    RASMIY VEB-SAYT
  </text>

  <!-- Website URL -->
  <text x="600" y="580" text-anchor="middle" fill="#fbbf24" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" letter-spacing="4">
    tashmedunitf.uz
  </text>
</svg>
