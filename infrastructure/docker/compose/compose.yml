# ============================================================
# TMTU Termiz — Docker Compose
#
# Run from repo root:
#   docker compose -f infrastructure/docker/compose/compose.yml up -d
#
# Or use the shortcut from package.json:
#   pnpm docker:up
# ============================================================

services:
  # ---------- Laravel API (PHP-FPM + Nginx) ----------
  app:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/images/Dockerfile.api
      target: production
    container_name: tmtu_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ADMIN_URL=${ADMIN_URL:-http://localhost:3001}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-tmtu_termiz}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - SESSION_LIFETIME=${SESSION_LIFETIME:-120}
      - SESSION_DOMAIN=${SESSION_DOMAIN:-}
      - SESSION_SECURE_COOKIE=${SESSION_SECURE_COOKIE:-false}
      - QUEUE_CONNECTION=redis
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS:-localhost:3000,localhost:3001}
      - REVALIDATION_SECRET=${REVALIDATION_SECRET}
      - MAIL_MAILER=${MAIL_MAILER:-log}
      - MAIL_HOST=${MAIL_HOST:-mailpit}
      - MAIL_PORT=${MAIL_PORT:-1025}
      - MAIL_USERNAME=${MAIL_USERNAME:-null}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-null}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-null}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@tashmedunitf.uz}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-TMTU}
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tmtu_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------- Queue Worker ----------
  queue:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/images/Dockerfile.api
      target: production
    container_name: tmtu_queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-tmtu_termiz}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - QUEUE_CONNECTION=redis
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    depends_on:
      - app
    networks:
      - tmtu_network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------- Task Scheduler ----------
  scheduler:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/images/Dockerfile.api
      target: production
    container_name: tmtu_scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do
        php /var/www/html/artisan schedule:run --no-interaction;
        sleep 60;
      done"
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-tmtu_termiz}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    depends_on:
      - app
    networks:
      - tmtu_network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:run' || true"]
      interval: 90s
      timeout: 5s
      retries: 3

  # ---------- PostgreSQL 16 ----------
  postgres:
    image: postgres:16-alpine
    container_name: tmtu_postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tmtu_termiz}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../configs/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-tmtu_termiz}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tmtu_network

  # ---------- Redis 7 ----------
  redis:
    image: redis:7-alpine
    container_name: tmtu_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tmtu_network

  # ---------- Next.js Public Website (web) ----------
  web:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/images/Dockerfile.web
    container_name: tmtu_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8000/api}
      - REVALIDATION_SECRET=${REVALIDATION_SECRET}
      - NODE_ENV=production
    depends_on:
      app:
        condition: service_healthy
    networks:
      - tmtu_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------- Next.js Admin Panel ----------
  admin:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/images/Dockerfile.admin
    container_name: tmtu_admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    environment:
      # Admin API uses /v1 prefix (different from frontend)
      - NEXT_PUBLIC_API_URL=${ADMIN_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_FRONTEND_URL=${WEB_URL:-http://localhost:3000}
      - REVALIDATION_SECRET=${REVALIDATION_SECRET}
      - NODE_ENV=production
      - PORT=3001
    depends_on:
      app:
        condition: service_healthy
    networks:
      - tmtu_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  # ⚠️ Production: back up regularly! `pnpm scripts/backup.sh`
  postgres_data:
    driver: local
    name: tmtu_postgres_data
  redis_data:
    driver: local
    name: tmtu_redis_data
  app_storage:
    driver: local
    name: tmtu_app_storage
  app_logs:
    driver: local
    name: tmtu_app_logs

networks:
  tmtu_network:
    driver: bridge
    name: tmtu_network
