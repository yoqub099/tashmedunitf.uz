# ╔══════════════════════════════════════════════════════════════╗
# ║  NGINX DEFAULT CONFIGURATION — TDTUTF Production Server     ║
# ║  Server: 60 GB RAM, 4 TB SSD                               ║
# ║  Domain: tdtutf.uz / tashmedunitf.uz                       ║
# ╚══════════════════════════════════════════════════════════════╝

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Upload limit — 500MB (katta video fayllar uchun)
    client_max_body_size 500M;

    # ──────────────────────────────────
    # XAVFSIZLIK HEADERLARI
    # ──────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ──────────────────────────────────
    # GZIP SIQISH
    # ──────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 32 8k;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/pdf
        image/svg+xml
        font/woff
        font/woff2;

    # ──────────────────────────────────
    # STATIK FAYLLAR — 1 yil kesh
    # ──────────────────────────────────
    location ~* \.(css|js|woff2|woff|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ──────────────────────────────────
    # MEDIA FAYLLAR — media.conf dan include
    # ──────────────────────────────────
    # Include media.conf if running standalone (without separate include)

    # Rasmlar — 1 yil kesh
    location ~* ^/storage/.*\.(webp|jpg|jpeg|png|gif|avif|svg|ico|bmp|tiff)$ {
        alias /var/www/html/storage/app/public/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*";
        etag on;
        location ~ \.php$ { deny all; }
        try_files $uri =404;
        access_log off;
    }

    # Videolar — streaming
    location ~* ^/storage/.*\.(mp4|webm|mov|avi|mkv)$ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Accept-Ranges "bytes";
        mp4;
        mp4_buffer_size 2m;
        mp4_max_buffer_size 20m;
        sendfile on;
        tcp_nopush on;
        location ~ \.php$ { deny all; }
        try_files $uri =404;
    }

    # Audio — streaming
    location ~* ^/storage/.*\.(mp3|wav|ogg|flac|aac|m4a)$ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges "bytes";
        sendfile on;
        location ~ \.php$ { deny all; }
        try_files $uri =404;
    }

    # PDF — brauzerda ochilsin
    location ~* ^/storage/.*\.pdf$ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Content-Disposition "inline";
        add_header X-Content-Type-Options "nosniff" always;
        sendfile on;
        location ~ \.php$ { deny all; }
        try_files $uri =404;
    }

    # Hujjatlar va kitoblar
    location ~* ^/storage/.*\.(doc|docx|xls|xlsx|ppt|pptx|txt|csv|epub|mobi)$ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        location ~ \.php$ { deny all; }
        try_files $uri =404;
    }

    # Arxivlar — download
    location ~* ^/storage/.*\.(zip|rar|7z|gz|tar)$ {
        alias /var/www/html/storage/app/public/;
        expires 3d;
        add_header Content-Disposition "attachment";
        sendfile on;
        tcp_nopush on;
        location ~ \.php$ { deny all; }
        try_files $uri =404;
    }

    # Umumiy storage fallback
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        location ~ \.php$ { deny all; }
        location ~ /\. { deny all; }
        try_files $uri =404;
        access_log off;
    }

    # Private fayllar — faqat PHP orqali (X-Accel-Redirect)
    location /private-files/ {
        internal;
        alias /var/www/html/storage/app/private/;
        add_header Cache-Control "no-store";
    }

    location ^~ /storage/private/ {
        deny all;
        return 403;
    }

    # ──────────────────────────────────
    # HEALTH CHECK
    # ──────────────────────────────────
    location = /api/health {
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ──────────────────────────────────
    # ASOSIY ROUTING
    # ──────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ──────────────────────────────────
    # PHP-FPM — Laravel
    # ──────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Timeout — katta fayllar uchun ko'proq vaqt
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout    300s;
        fastcgi_read_timeout    300s;

        # Buffer — 60GB RAM da katta qilish mumkin
        fastcgi_buffer_size     64k;
        fastcgi_buffers         32 32k;
        fastcgi_busy_buffers_size 128k;
    }

    # ──────────────────────────────────
    # XAVFSIZLIK — YASHIRIN FAYLLAR
    # ──────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* (composer\.(json|lock)|\.env|artisan|\.git)$ {
        deny all;
    }

    # Favicon — log yozmaslik
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
