# ╔══════════════════════════════════════════════════════════════╗
# ║  NGINX MEDIA CONFIGURATION — TDTUTF Production Server      ║
# ║  Server: 60 GB RAM, 4 TB SSD                               ║
# ║  OS: Ubuntu 22.04+ / CentOS 8+                             ║
# ╠══════════════════════════════════════════════════════════════╣
# ║                                                              ║
# ║  Bu config statik fayllarni PHP ga tegmasdan                ║
# ║  to'g'ridan-to'g'ri Nginx orqali beradi.                   ║
# ║                                                              ║
# ║  Include qilish:                                            ║
# ║    include /etc/nginx/conf.d/media.conf;                    ║
# ║                                                              ║
# ║  Storage Struktura:                                         ║
# ║    /var/www/tmtu-termiz/storage/app/public/                 ║
# ║    ├── news/{id}/{collection}/filename.webp                 ║
# ║    ├── staff/{id}/photo/avatar.webp                         ║
# ║    ├── departments/{id}/gallery/photo.webp                  ║
# ║    ├── banners/{id}/image/banner.webp                       ║
# ║    ├── library/{id}/document/kitob.pdf                      ║
# ║    ├── journal/{id}/file/jurnal.pdf                         ║
# ║    └── ...                                                  ║
# ║                                                              ║
# ╚══════════════════════════════════════════════════════════════╝


# ══════════════════════════════════════════════
# 1. RASMLAR — ULTRA TEZ BERISH (1 yil kesh)
# ══════════════════════════════════════════════
#
# Rasmlar o'zgarmaydi — yangi rasm = yangi URL
# Shuning uchun 1 yil immutable kesh to'g'ri
#
# URL misollari:
#   /storage/news/5/thumbnail/foto.webp
#   /storage/staff/12/photo/avatar.webp
#   /storage/banners/1/image/banner.webp
#   /storage/news/5/thumbnail/conversions/foto-thumbnail.webp
#

location ~* ^/storage/.*\.(webp|jpg|jpeg|png|gif|avif|svg|ico|bmp|tiff)$ {
    alias /var/www/tmtu-termiz/storage/app/public/;

    # 1 yil kesh (365 kun) — rasm fayli hech qachon o'zgarmaydi
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";

    # Xavfsizlik
    add_header X-Content-Type-Options "nosniff" always;

    # CORS — frontend va admin dan rasm olish uchun
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, OPTIONS";

    # ETag va Last-Modified — conditional request uchun
    etag on;
    if_modified_since exact;

    # PHP fayllarni BLOKLASH (xavfsizlik)
    location ~ \.php$ { deny all; }

    try_files $uri =404;
    access_log off;  # Rasm uchun log yozmaslik — performance
}


# ══════════════════════════════════════════════
# 2. VIDEOLAR — HTTP Range Streaming
# ══════════════════════════════════════════════
#
# Nginx mp4 moduli bilan pseudo-streaming:
# - Brauzer istalgan joydan boshlashi mumkin (seek)
# - Butun faylni yuklamasdan ko'rish mumkin
# - 60GB RAM da katta buffer ishlatish mumkin
#
# URL misollari:
#   /storage/news/1/videos/konferensiya.mp4
#   /storage/departments/3/videos/tanishuv.mp4
#   /storage/banners/2/video/promo.mp4
#

location ~* ^/storage/.*\.(mp4|webm|mov|avi|mkv|3gp|flv)$ {
    alias /var/www/tmtu-termiz/storage/app/public/;

    # 30 kun kesh (video o'zgarishi mumkin)
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";

    # Xavfsizlik
    add_header X-Content-Type-Options "nosniff" always;

    # CORS
    add_header Access-Control-Allow-Origin "*";
    add_header Accept-Ranges "bytes";

    # MP4 streaming (Nginx mp4 moduli kerak: ngx_http_mp4_module)
    mp4;
    mp4_buffer_size       2m;   # Boshlang'ich buffer (60GB RAM da katta qilish mumkin)
    mp4_max_buffer_size   20m;  # Maksimal buffer — katta video uchun

    # Katta fayllar uchun sendfile
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Output buffering — 60GB RAM da katta qilish mumkin
    output_buffers 2 1m;

    location ~ \.php$ { deny all; }
    try_files $uri =404;
}


# ══════════════════════════════════════════════
# 3. AUDIO — Streaming
# ══════════════════════════════════════════════
#
# URL misollari:
#   /storage/news/1/audio/podcast.mp3
#   /storage/directions/5/audio/leksiya.mp3
#

location ~* ^/storage/.*\.(mp3|wav|ogg|flac|aac|m4a|weba)$ {
    alias /var/www/tmtu-termiz/storage/app/public/;

    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Accept-Ranges "bytes";

    sendfile on;
    tcp_nopush on;

    location ~ \.php$ { deny all; }
    try_files $uri =404;
}


# ══════════════════════════════════════════════
# 4. PDF VA HUJJATLAR — Inline ko'rsatish
# ══════════════════════════════════════════════
#
# PDF: brauzerda ochiladi (inline)
# Word/Excel/PPT: download qilinadi
#
# URL misollari:
#   /storage/library/3/document/darslik.pdf
#   /storage/journal/7/file/jurnal-2026-01.pdf
#   /storage/directions/2/curriculum/oqv-reja.pdf
#   /storage/staff/5/cv/resume.pdf
#

location ~* ^/storage/.*\.pdf$ {
    alias /var/www/tmtu-termiz/storage/app/public/;

    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;

    # PDF brauzerda ochilsin
    add_header Content-Disposition "inline";

    sendfile on;
    location ~ \.php$ { deny all; }
    try_files $uri =404;
}

location ~* ^/storage/.*\.(doc|docx|xls|xlsx|ppt|pptx|txt|csv|rtf|odt|ods|odp)$ {
    alias /var/www/tmtu-termiz/storage/app/public/;

    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;

    location ~ \.php$ { deny all; }
    try_files $uri =404;
}


# ══════════════════════════════════════════════
# 5. KITOBLAR — E-book fayllar
# ══════════════════════════════════════════════
#
# URL misollari:
#   /storage/library/3/document/anatomiya.epub
#   /storage/directions/2/books/darslik.pdf
#   /storage/pages/15/books/qollanma.epub
#

location ~* ^/storage/.*\.(epub|mobi|fb2|cbz|djvu)$ {
    alias /var/www/tmtu-termiz/storage/app/public/;

    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition "attachment";

    location ~ \.php$ { deny all; }
    try_files $uri =404;
}


# ══════════════════════════════════════════════
# 6. ARXIVLAR — Download
# ══════════════════════════════════════════════
#
# URL misollari:
#   /storage/news/1/archives/materiallar.zip
#   /storage/departments/3/archives/hisobot.rar
#

location ~* ^/storage/.*\.(zip|rar|7z|gz|tar|bz2|tar\.gz)$ {
    alias /var/www/tmtu-termiz/storage/app/public/;

    expires 3d;
    add_header Cache-Control "public, max-age=259200";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition "attachment";

    sendfile on;
    tcp_nopush on;

    location ~ \.php$ { deny all; }
    try_files $uri =404;
}


# ══════════════════════════════════════════════
# 7. UMUMIY STORAGE FALLBACK
# ══════════════════════════════════════════════
#
# Yuqoridagi regex larga tushmaganlar shu yerga tushadi
#

location ^~ /storage/ {
    alias /var/www/tmtu-termiz/storage/app/public/;

    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;

    # PHP fayllarni BLOKLASH
    location ~ \.php$ { deny all; }

    # .htaccess, .env, .git kabi fayllarni BLOKLASH
    location ~ /\. { deny all; }

    try_files $uri =404;
    access_log off;
}


# ══════════════════════════════════════════════
# 8. MAXFIY FAYLLAR — NGINX BERMAYDI
# ══════════════════════════════════════════════
#
# Private fayllar (ish arizalari, maxfiy hujjatlar) faqat
# Laravel auth orqali beriladi:
#   URL: POST /api/v1/media/download/{id}
#
# Nginx X-Accel-Redirect orqali faylni beradi:
#   PHP: return response()->header('X-Accel-Redirect', '/private-files/...');
#

location /private-files/ {
    internal;  # Faqat PHP X-Accel-Redirect orqali
    alias /var/www/tmtu-termiz/storage/app/private/;

    # Kesh yo'q (har safar auth tekshiriladi)
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
}

# Private storage ga to'g'ridan-to'g'ri kirishni BLOKLASH
location ^~ /storage/private/ {
    deny all;
    return 403;
}


# ══════════════════════════════════════════════
# 9. UPLOAD LIMITLAR
# ══════════════════════════════════════════════
#
# 500 MB — eng katta video/arxiv fayllar uchun
# 4TB SSD server uchun bu yetarli
#

client_max_body_size        500m;
client_body_buffer_size     10m;
client_body_temp_path       /tmp/nginx_uploads;
client_body_in_file_only    off;


# ══════════════════════════════════════════════
# 10. GZIP SIQISH
# ══════════════════════════════════════════════
#
# Matn fayllarni siqish (JSON, CSS, JS, SVG, PDF)
# Rasmlar (WebP, JPEG, PNG) allaqachon siqilgan — qo'shimcha siqish kerak emas
#

gzip                on;
gzip_vary           on;
gzip_min_length     1024;        # 1KB dan kichik fayllarni siqmaslik
gzip_proxied        any;
gzip_comp_level     6;           # 60GB RAM da 6 optimal
gzip_buffers        32 8k;       # 60GB RAM da katta buffer
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/pdf
    application/x-font-ttf
    application/x-font-opentype
    application/vnd.ms-fontobject
    font/opentype
    font/woff
    font/woff2
    image/svg+xml;

gzip_disable "msie6";


# ══════════════════════════════════════════════
# 11. OPEN FILE CACHE — 60GB RAM da ko'p kesh
# ══════════════════════════════════════════════
#
# Tez-tez so'raladigan fayllarning file descriptor larini
# xotirada saqlash — disk I/O kamayadi
#
# 60GB RAM bilan 100,000+ faylni kesh qilish mumkin
#

open_file_cache          max=100000 inactive=60m;
open_file_cache_valid    30m;
open_file_cache_min_uses 2;
open_file_cache_errors   on;


# ══════════════════════════════════════════════
# 12. SENDFILE OPTIMIZATION — 4TB SSD
# ══════════════════════════════════════════════
#
# sendfile — kernel space dan to'g'ridan-to'g'ri yuborish
# SSD da bu juda tez ishlaydi
#

sendfile        on;
tcp_nopush      on;
tcp_nodelay     on;

# AIO — async I/O (Linux da directio bilan birga)
# 4TB SSD da katta fayllar uchun foydali
aio             threads;
directio        10m;     # 10MB dan katta fayllar uchun direct I/O
directio_alignment 4k;   # SSD sector size
