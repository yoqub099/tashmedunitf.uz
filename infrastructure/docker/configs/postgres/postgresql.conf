# PostgreSQL configuration — TMTU Termiz Project
# ⚠️ MUHIM: shared_buffers va effective_cache_size ni serveringiz RAM ga moslab o'zgartiring!
# Formulalar: shared_buffers = RAM * 0.25, effective_cache_size = RAM * 0.75
# Masalan: 8GB RAM → shared_buffers=2GB, effective_cache_size=6GB
#          16GB RAM → shared_buffers=4GB, effective_cache_size=12GB
#          64GB RAM → shared_buffers=16GB, effective_cache_size=48GB

# Connection Settings
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 5

# Memory — 16GB RAM server uchun default qiymatlar
# Production serverda RAM ga moslab o'zgartiring!
shared_buffers = 4GB
effective_cache_size = 12GB
work_mem = 64MB
maintenance_work_mem = 512MB
huge_pages = try

# WAL
wal_buffers = 16MB
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
wal_compression = on

# Query Planner
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Safety — uzoq davom etadigan so'rovlarni to'xtatish
statement_timeout = 30000
idle_in_transaction_session_timeout = 60000

# Parallel Query
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 2

# Logging
log_timezone = 'Asia/Tashkent'
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_statement = 'ddl'

# JIT
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

# Locale
datestyle = 'iso, mdy'
timezone = 'Asia/Tashkent'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'
