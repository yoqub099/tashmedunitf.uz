# ============================================================
# NGINX KONFIGURATSIYA — TDTUTF Production Server
# ============================================================
#
# Server: Ubuntu, 200GB RAM, 10TB disk
# 1,000,000 foydalanuvchi uchun optimizatsiya qilingan
#
# TEZLIK SIRI:
#   Nginx RASMLARNI O'ZI BERADI — PHP/Laravel ga TEGMAYDI!
#   PHP faqat API (JSON) uchun ishlaydi.
#   Rasm/video/PDF → Nginx → Disk → Foydalanuvchi (2-5ms)
#
# JOYLASH:
#   sudo cp nginx-production.conf /etc/nginx/sites-available/tdtutf.uz
#   sudo ln -s /etc/nginx/sites-available/tdtutf.uz /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# ============================================================

# ---- WORKER SOZLAMALARI ----
# auto = CPU yadrolar soniga qarab (server: 8-16 yadro)
# worker_connections = bir worker nechta ulanishni boshqaradi
# Jami: 16 worker × 4096 = 65,536 parallel ulanish

# Bu main block — nginx.conf da o'rnatiladi:
# worker_processes auto;
# worker_rlimit_nofile 65536;
# events {
#     worker_connections 4096;
#     multi_accept on;
#     use epoll;
# }

# ---- PROXY CACHE (CDN o'rniga) ----
# Rasmlarni RAM da cache qiladi — disk EMAS
# 200GB RAM bor — 50GB ni cache uchun ajratamiz
proxy_cache_path /var/cache/nginx/media
    levels=1:2
    keys_zone=media_cache:100m        # 100MB key zone (10M URL saqlaydi)
    max_size=50g                      # 50GB max cache
    inactive=30d                      # 30 kun ishlatilmasa o'chiradi
    use_temp_path=off;

# ---- RATE LIMITING ----
# DDoS himoya: 1 IP dan sekundiga max 30 request
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/s;

# ============================================================
# HTTPS SERVER (Asosiy)
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tdtutf.uz www.tdtutf.uz;

    # ---- SSL SERTIFIKAT (Let's Encrypt — BEPUL!) ----
    ssl_certificate /etc/letsencrypt/live/tdtutf.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tdtutf.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — brauzer faqat HTTPS ishlatadi
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ---- ASOSIY PAPKALAR ----
    root /var/www/tmtu-termiz/public;
    index index.php;

    # ---- GZIP SIQISH ----
    # HTML, CSS, JS, JSON fayllarni 70% kichiklashtiradi
    # Rasm/video SIQILMAYDI (ular allaqachon siqilgan)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/font-woff
        application/font-woff2;

    # ---- CLIENT BODY ----
    # Video yuklash uchun 500MB gacha
    client_max_body_size 500M;
    client_body_timeout 300s;
    client_body_buffer_size 128k;

    # ============================================================
    # ⚡ STATIK FAYLLAR — NGINX TO'G'RIDAN-TO'G'RI BERADI
    # ============================================================
    #
    # BU ENG MUHIM QISM!
    # Rasmlar, videolar, PDF lar — PHP ga TEGMAYDI!
    # Nginx diskdan oladi va foydalanuvchiga beradi.
    # Natija: 2-5ms (PHP orqali 50-200ms bo'lardi)
    #
    # ============================================================

    # ---- RASMLAR (jpg, png, webp, svg, gif, ico) ----
    # 1 yil cache + immutable = brauzer qayta so'ramaydi
    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|avif)$ {
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header X-Content-Type-Options "nosniff";
        add_header Vary "Accept-Encoding";
        access_log off;    # LOG YOZMA — tezroq ishlaydi
        tcp_nodelay on;
        tcp_nopush on;
        sendfile on;       # sendfile = disk → network (kernel darajada, ultra tez)
        sendfile_max_chunk 1m;
        try_files $uri =404;
    }

    # ---- VIDEO FAYLLAR (mp4, webm, mpeg, mov, mkv, 3gp) ----
    # Range request — video oqimi (seeking) ishlaydi
    # 7 kun cache
    location ~* \.(mp4|webm|mpeg|mov|avi|mkv|3gp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Accept-Ranges bytes;
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        sendfile on;
        sendfile_max_chunk 512k;   # 512KB chunk (video streaming uchun)
        aio on;                     # Async I/O (katta fayllar uchun)
        directio 1m;                # 1MB dan katta fayllar — direct I/O
        try_files $uri =404;
    }

    # ---- AUDIO FAYLLAR (mp3, wav, ogg, flac, aac, wma) ----
    # Range request — audio seeking ishlaydi
    # 30 kun cache
    location ~* \.(mp3|wav|ogg|flac|aac|wma|m4a)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges bytes;
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        sendfile on;
        sendfile_max_chunk 256k;
        aio on;
        directio 512k;
        try_files $uri =404;
    }

    # ---- HUJJATLAR (pdf, doc, xls, ppt, epub, txt, csv, rtf) ----
    # 30 kun cache
    location ~* \.(pdf|doc|docx|xls|xlsx|ppt|pptx|epub|mobi|fb2|txt|csv|rtf|odt|ods|odp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        sendfile on;
        try_files $uri =404;
    }

    # ---- ARXIVLAR (zip, rar, 7z, tar, gz) ----
    # 90 kun cache — kamdan-kam o'zgaradi
    location ~* \.(zip|rar|7z|tar|gz|bz2|xz)$ {
        expires 90d;
        add_header Cache-Control "public, max-age=7776000";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        sendfile on;
        sendfile_max_chunk 1m;
        aio on;
        directio 1m;
        try_files $uri =404;
    }

    # ---- SHRIFTLAR (woff, woff2, ttf, eot) ----
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        try_files $uri =404;
    }

    # ---- CSS/JS (frontend assets) ----
    location ~* \.(css|js)$ {
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        try_files $uri =404;
    }

    # ============================================================
    # STORAGE SYMLINK — Media fayllar
    # ============================================================
    #
    # /storage/media/1/photo.webp
    #   → /var/www/tmtu-termiz/storage/app/public/media/1/photo.webp
    #
    # Nginx bu yo'ldan FAYLNI O'ZI BERADI
    # PHP/Laravel ga UMUMAN SO'ROV BERMAYDI
    #
    location ^~ /storage/ {
        alias /var/www/tmtu-termiz/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        sendfile on;
        tcp_nodelay on;
        try_files $uri =404;
    }

    # ============================================================
    # API — PHP-FPM (faqat JSON so'rovlar)
    # ============================================================
    #
    # /api/v1/news     → PHP-FPM → Laravel → PostgreSQL → JSON
    # /api/v1/search   → PHP-FPM → Laravel → PostgreSQL → JSON
    #
    # Faqat API endpointlar PHP ga boradi
    # Rasmlar BORMAYDI!
    #
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Rate limiting — DDoS himoya
        limit_req zone=api burst=50 nodelay;

        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # FastCGI cache va timeout
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 300s;     # Katta video yuklash uchun
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;

        # Xavfsizlik
        fastcgi_param HTTP_PROXY "";
    }

    # ---- UPLOAD ENDPOINTI — alohida rate limit ----
    location = /api/v1/media/upload {
        limit_req zone=upload burst=10 nodelay;
        client_max_body_size 500M;
        client_body_timeout 600s;

        try_files $uri /index.php?$query_string;
    }

    # ---- XAVFSIZLIK ----
    # .env, .git va boshqa maxfiy fayllarni bloklash
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # vendor papkasini bloklash
    location ~ ^/vendor/ {
        deny all;
    }

    # storage papkasidagi PHP fayllarni bloklash
    location ~ ^/storage/.*\.php$ {
        deny all;
    }

    # ---- ERROR PAGES ----
    error_page 404 /index.php;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ============================================================
# HTTP → HTTPS REDIRECT
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name tdtutf.uz www.tdtutf.uz;

    # Let's Encrypt sertifikat yangilash uchun
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Qolgan hamma narsa HTTPS ga redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# NEXT.JS FRONTEND PROXY
# ============================================================
#
# Frontend: Next.js (SSR) — alohida port
# Nginx reverse proxy sifatida ishlaydi
#
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.tdtutf.uz;

    ssl_certificate /etc/letsencrypt/live/tdtutf.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tdtutf.uz/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js static assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }
}
