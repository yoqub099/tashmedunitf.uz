# ============================================================
# TDTUTF — Production Nginx SITE config (monorepo-aware)
# ============================================================
# Install: copy to /etc/nginx/sites-available/tdtutf.uz then
#          ln -s /etc/nginx/sites-available/tdtutf.uz /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
#          certbot --nginx -d tdtutf.uz -d www.tdtutf.uz -d admin.tdtutf.uz
#
# Requires these http{} zones in the MAIN /etc/nginx/nginx.conf
# (deploy-production.sh already adds them):
#   proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media_cache:100m max_size=50g inactive=30d;
#   limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
#   limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/s;
#
# TOPOLOGY (adjust domains/ports to your infrastructure):
#   tdtutf.uz / www.tdtutf.uz  -> Next.js WEB  (:3000) + Laravel /api + /storage
#   admin.tdtutf.uz            -> Next.js ADMIN (:3001) + Laravel /api
#
# Run all THREE services first (see docs/DEPLOYMENT.md):
#   - Laravel API : php8.4-fpm  (serves /api + /storage from apps/api/public)
#   - Next WEB    : node apps/web/.next/standalone/apps/web/server.js     (PORT=3000)
#   - Next ADMIN  : node apps/admin/.next/standalone/apps/admin/server.js (PORT=3001)
# ============================================================

upstream tmtu_web   { server 127.0.0.1:3000; keepalive 32; }
upstream tmtu_admin { server 127.0.0.1:3001; keepalive 32; }

# Laravel public dir (monorepo path — NOT the repo root)
map $host $tmtu_laravel_root { default /var/www/tmtu-termiz/apps/api/public; }

# ============ PUBLIC SITE — tdtutf.uz ============
server {
    listen 80;
    listen [::]:80;
    server_name tdtutf.uz www.tdtutf.uz;
    # certbot inserts the listen 443 ssl block + the 80->443 redirect here.

    root /var/www/tmtu-termiz/apps/api/public;
    index index.php;
    client_max_body_size 500M;
    server_tokens off;

    # ---- Laravel REST API ----
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # ---- Uploaded media (Spatie Media Library) — cached, long expiry ----
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---- PHP-FPM front controller (Laravel) ----
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        include fastcgi_params;
    }

    # ---- Everything else -> Next.js WEB (SSR/ISR) ----
    location / {
        proxy_pass http://tmtu_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ============ ADMIN PANEL — admin.tdtutf.uz ============
server {
    listen 80;
    listen [::]:80;
    server_name admin.tdtutf.uz;

    root /var/www/tmtu-termiz/apps/api/public;
    index index.php;
    client_max_body_size 500M;
    server_tokens off;

    # Admin should never be cached/indexed
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location /storage/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        include fastcgi_params;
    }

    location / {
        proxy_pass http://tmtu_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
